name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o forge-uploader.exe .
      - uses: softprops/action-gh-release@v2
        with:
          files: forge-uploader.exe
